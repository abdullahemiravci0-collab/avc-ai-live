<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Avcı AI - Live Mod</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: system-ui, -apple-system, sans-serif;
    background: #0d1b2a; color: #e0e1dd; 
    margin: 0; padding: 0; height: 100vh;
    display: flex; flex-direction: column; justify-content: center; align-items: center;
  }
  .live-container { text-align: center; padding: 20px; width: 100%; max-width: 400px; display: flex; flex-direction: column; height: 100%; }
  
  .top-bar { display: flex; justify-content: flex-end; padding-bottom: 10px; }
  .btn-settings { background: #1b263b; color: #ff7b00; border: 1px solid #ff7b00; padding: 8px 12px; border-radius: 8px; font-weight: bold; cursor: pointer; }

  .status-badge {
    background: #e74c3c; color: white; padding: 6px 12px; border-radius: 20px;
    font-size: 12px; font-weight: bold; display: inline-block; margin-bottom: 30px;
    animation: pulse 2s infinite; align-self: center;
  }
  .status-badge.off { background: #2a3b55; animation: none; }
  @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

  .mic-circle {
    width: 120px; height: 120px; border-radius: 50%;
    background: #1b263b; border: 4px solid #ff7b00;
    display: flex; justify-content: center; align-items: center;
    font-size: 50px; margin: 0 auto 30px; cursor: pointer;
    transition: all 0.3s;
  }
  .mic-circle.active { background: #ff7b00; transform: scale(1.1); box-shadow: 0 0 20px #ff7b00; }
  
  .transcript {
    background: #1b263b; padding: 15px; border-radius: 12px;
    flex: 1; overflow-y: auto; font-size: 15px; color: #a0a0a0;
    border-left: 4px solid #ff7b00; text-align: left;
    margin-bottom: 20px; display: flex; flex-direction: column; gap: 10px;
  }
  .t-user { color: #fff; font-weight: bold; }
  .t-bot { color: #ff7b00; }

  .btn-toggle {
    padding: 15px 30px; border: none; border-radius: 30px;
    font-size: 18px; font-weight: bold; cursor: pointer;
    background: #ff7b00; color: #fff; width: 100%;
  }
  .btn-toggle.stop { background: #e74c3c; }

  /* Ayarlar Ekranı (Modal) */
  #settingsModal {
    display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.8); z-index: 100;
    justify-content: center; align-items: center;
  }
  .modal-content {
    background: #1b263b; padding: 20px; border-radius: 14px; width: 90%; max-width: 350px;
    text-align: left; border: 1px solid #2a3b55;
  }
  .modal-content h3 { color: #ff7b00; margin-top: 0; }
  .api-input {
    width: 100%; padding: 12px; border: 1px solid #2a3b55; border-radius: 10px;
    font-size: 14px; background: #0d1b2a; color: #e0e1dd; outline: none; margin-bottom: 12px;
    font-family: monospace;
  }
  .btn-row { display: flex; gap: 8px; }
  .btn-save { background: #ff7b00; color: #fff; border: none; padding: 12px; border-radius: 8px; font-weight: bold; flex: 1; cursor: pointer; }
  .btn-close { background: #2a3b55; color: #fff; border: none; padding: 12px; border-radius: 8px; font-weight: bold; flex: 1; cursor: pointer; }
</style>
</head>
<body>

<div class="live-container">
  <div class="top-bar">
    <button class="btn-settings" onclick="openSettings()">⚙️ Ayarlar</button>
  </div>

  <div id="statusBadge" class="status-badge off">HAZIR - BAŞLATMAK İÇİN DOKUN</div>
  
  <div id="micCircle" class="mic-circle" onclick="toggleLive()">
    🎤
  </div>

  <div class="transcript" id="transcript">
    <div><span class="t-bot">Sistem:</span> Canlı moda geçmek için butona bas. Beni dinlemeye başlayacağım.</div>
  </div>

  <button id="mainBtn" class="btn-toggle" onclick="toggleLive()">CANLI MODU BAŞLAT</button>
</div>

<!-- API Ayarları Ekranı -->
<div id="settingsModal">
  <div class="modal-content">
    <h3>🔑 Gemini API Anahtarı</h3>
    <p style="font-size:13px; color:#a0a0a0; margin-top:0;">Kendi anahtarını gir. Sadece bu cihazda saklanır.</p>
    <input id="apiKeyInput" class="api-input" type="text" placeholder="AIza..." autocomplete="off" spellcheck="false" />
    <div class="btn-row">
      <button class="btn-save" onclick="saveKey()">💾 Kaydet</button>
      <button class="btn-close" onclick="closeSettings()">Kapat</button>
    </div>
  </div>
</div>

<script>
// API Ayarları
const KEY_STORAGE = "avci_gemini_key";
const VIP_STORAGE = "avci_vip_mode";

let isLive = false;
let recognition = null;
let isProcessing = false; 

function getKey() { return localStorage.getItem(KEY_STORAGE) || ""; }
function isVip() { return localStorage.getItem(VIP_STORAGE) === "true"; }

// --- AYARLAR PENCERESİ ---
function openSettings() {
  document.getElementById("apiKeyInput").value = getKey();
  document.getElementById("settingsModal").style.display = "flex";
}
function closeSettings() {
  document.getElementById("settingsModal").style.display = "none";
}
function saveKey() {
  const v = document.getElementById("apiKeyInput").value.trim();
  if(!v) {
    localStorage.removeItem(KEY_STORAGE);
    alert("Anahtar silindi.");
  } else {
    localStorage.setItem(KEY_STORAGE, v);
    alert("✅ Anahtar kaydedildi!");
  }
  closeSettings();
}

// --- CANLI MOD MANTIĞI ---
function speakText(text) {
  return new Promise((resolve) => {
    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'tr-TR';
      utterance.rate = 1.05;
      utterance.onend = () => resolve(); 
      window.speechSynthesis.speak(utterance);
    } else { resolve(); }
  });
}

function addLog(text, type) {
  const t = document.getElementById("transcript");
  const d = document.createElement("div");
  d.innerHTML = `<span class="${type === 'user' ? 't-user' : 't-bot'}">${type === 'user' ? 'Sen' : 'Avcı AI'}:</span> ${text}`;
  t.appendChild(d);
  t.scrollTop = t.scrollHeight;
}

async function askGemini(text) {
  const key = getKey();
  if(!key) {
    await speakText("Lütfen önce sağ üstteki ayarlardan API anahtarını gir.");
    addLog("Lütfen önce ayarlardan API anahtarını gir.", "bot");
    return null;
  }

  const models = ["gemini-2.5-flash", "gemini-3.5-flash", "gemini-1.5-pro-latest"];
  let bodyData = { contents: [{ role: "user", parts: [{ text: text }] }] };

  if (isVip()) {
    bodyData.system_instruction = { 
      parts: [{ text: "Sen Avcı AI'sın. Kullanıcı ailen. Onlara samimi davran. Cevaplarını kısa ve net tut, çünkü sesli asistan olarak konuşuyorsun." }] 
    };
  }

  for (const model of models) {
    try {
      const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${key}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(bodyData)
      });
      if(res.ok) {
        const data = await res.json();
        const reply = data.candidates?.[0]?.content?.parts?.[0]?.text;
        if(reply) return reply;
      }
    } catch(e) { }
  }
  return "Bağlantı hatası.";
}

async function processVoice(transcriptText) {
  if(isProcessing) return;
  isProcessing = true;
  
  addLog(transcriptText, "user");
  const reply = await askGemini(transcriptText);
  
  if(reply) {
    addLog(reply, "bot");
    if (recognition) recognition.stop();
    await speakText(reply);
  }
  
  isProcessing = false;
  if (isLive) {
    setTimeout(() => { try { recognition.start(); } catch(e){} }, 500);
  }
}

function toggleLive() {
  if(!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
    return alert("Tarayıcınız canlı mikrofon modunu desteklemiyor.");
  }

  const badge = document.getElementById("statusBadge");
  const circle = document.getElementById("micCircle");
  const btn = document.getElementById("mainBtn");

  isLive = !isLive;

  if (isLive) {
    badge.className = "status-badge";
    badge.textContent = "CANLI - DİNLİYOR";
    circle.classList.add("active");
    btn.textContent = "CANLI MODU DURDUR";
    btn.classList.add("stop");

    recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
    recognition.lang = 'tr-TR';
    recognition.continuous = true; 
    recognition.interimResults = false;

    recognition.onresult = (event) => {
      const last = event.results.length - 1;
      const text = event.results[last][0].transcript.trim();
      if (text.length > 1) processVoice(text);
    };

    recognition.onerror = (e) => {
      if(e.error === 'not-allowed') {
        alert("Mikrofon izni verilmedi!");
        if(isLive) toggleLive(); 
      }
    };

    recognition.onend = () => {
      if (isLive && !isProcessing) {
        try { recognition.start(); } catch(e){}
      }
    };

    try { recognition.start(); } catch(e){}
    
  } else {
    badge.className = "status-badge off";
    badge.textContent = "DURDURULDU";
    circle.classList.remove("active");
    btn.textContent = "CANLI MODU BAŞLAT";
    btn.classList.remove("stop");
    if (recognition) recognition.stop();
    if ('speechSynthesis' in window) window.speechSynthesis.cancel();
  }
}
</script>
</body>
</html>
